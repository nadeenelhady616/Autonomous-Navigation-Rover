# Standalone Nav2 local costmap built from the simulated lidar (/scan).
# Node name must be "local_costmap" (see autonomous.launch.py).
local_costmap:
  ros__parameters:
    use_sim_time: true

    # Frames: odom -> base_footprint comes from diff_drive_controller,
    # base_scan comes from robot_state_publisher.
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5

    # Rolling window that follows the rover.
    rolling_window: true
    width: 6
    height: 6
    resolution: 0.05

    update_frequency: 10.0
    publish_frequency: 5.0
    always_send_full_costmap: true   # lets RViz's Map display work without the *_updates topic

    robot_radius: 0.12

    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      footprint_clearing_enabled: true
      observation_sources: scan
      scan:
        topic: /scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true          # Gazebo reports "no hit" as inf; treat as free space up to max range
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_min_range: 0.12
        obstacle_max_range: 3.0
        raytrace_min_range: 0.0
        raytrace_max_range: 3.4

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.35
